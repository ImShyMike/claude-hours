<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>claude-hours</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>claude-hours</h1>
          <nav class="nav"><a href="/" aria-current="page">Overview</a><a href="/timeline">Timeline</a></nav>
        </div>
        <div class="controls">
          <form id="who" class="who muted" method="post" action="/logout" hidden>
            <label>
              viewing
              <select id="person" aria-label="Whose dashboard"></select>
            </label>
            <button type="submit" class="link">log out</button>
          </form>
          <div class="segmented" role="group" aria-label="Range">
            <button data-range="today">Today</button>
            <button data-range="7">7 days</button>
            <button data-range="30">30 days</button>
            <button data-range="all">All</button>
          </div>
          <label class="muted">
            idle cap
            <select id="idle">
              <option value="2">2 min</option>
              <option value="5">5 min</option>
              <option value="10">10 min</option>
              <option value="15">15 min</option>
            </select>
          </label>
        </div>
      </header>

      <div class="top">
        <section class="hero">
          <div class="hero-value" id="total">-</div>
          <div class="muted" id="total-label"></div>
        </section>
        <section class="tiles" id="tiles"></section>
      </div>

      <p class="empty muted" id="empty" hidden>nothing logged in this range yet</p>

      <div id="content" hidden>
        <section class="card" id="days-card">
          <h2>Active time per day</h2>
          <div class="legend" id="days-legend"></div>
          <div class="chart" id="days"></div>
        </section>

        <div class="pair">
          <section class="card">
            <h2>Projects</h2>
            <div id="projects"></div>
          </section>
          <section class="card">
            <h2>Languages <span class="muted">by files changed</span></h2>
            <div id="languages"></div>
          </section>
        </div>

        <div class="pair">
          <section class="card">
            <h2>Time of day</h2>
            <div class="legend" id="hours-legend"></div>
            <div class="chart" id="hours"></div>
          </section>
          <section class="card" id="writing-card">
            <h2>How you write <span class="muted">per prompt, sent or not</span></h2>
            <div class="mini" id="writing"></div>
          </section>
        </div>

        <section class="card">
          <div class="card-head">
            <h2>Every day <span class="muted">all time, whatever the range</span></h2>
            <div class="heat-legend muted" id="heat-legend"></div>
          </div>
          <div class="chart hscroll" id="heat"></div>
        </section>

        <section class="card">
          <h2>Tools</h2>
          <div id="tools" class="two"></div>
        </section>

        <section class="card">
          <h2>Sessions</h2>
          <div class="scroll"><table id="sessions"></table></div>
        </section>
      </div>
    </main>
    <div class="tooltip" id="tooltip" hidden></div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
